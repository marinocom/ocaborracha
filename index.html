* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --ink: #26233a; --paper: #e9dcc4; --card: #f7f0e3; }
html, body { height: 100%; }
body { background: #d9c9ab; font-family: Poppins, system-ui, sans-serif; font-weight: 500; color: var(--ink);
       display: flex; }
button { font: inherit; color: inherit; cursor: pointer; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 24px; padding: 20px; width: 100%;
       height: 100vh; max-width: calc((100vh - 40px) * 0.7071 + 444px); margin: 0 auto; }
.boardwrap { position: relative; min-height: 0; display: flex; align-items: center; justify-content: center; }
.scaler { position: absolute; left: 50%; top: 50%; transform-origin: 0 0; }
.page { box-shadow: 0 10px 30px rgba(38,35,58,.25); border-radius: 6px; }

.page { position: relative; width: 842.25px; height: 1190.25px; overflow: hidden; background: #ecdcc0; }
.boardimg { position: absolute; inset: 0; width: 100%; height: 100%; user-select: none; }
.cell { position: absolute; border-radius: 2px; }
.cell:hover { background: rgba(255,255,255,.12); }

.cell { cursor: pointer; transition: box-shadow .2s; }
.cell.here { box-shadow: 0 0 0 4px #fff, 0 0 0 7px var(--ink), 0 0 18px 8px rgba(255,255,255,.55); z-index: 2; }
.token { position: absolute; width: 28px; height: 28px; border-radius: 50%; border: 2.4px solid var(--ink);
         display: flex; align-items: center; justify-content: center; font: 700 13px Poppins;
         color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.5); z-index: 5; pointer-events: none;
         transition: left .22s ease, top .22s ease, transform .22s; box-shadow: 0 2.4px 0 var(--ink); }
.token.active { transform: scale(1.25); z-index: 6; }

.panel { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.box { background: var(--card); border: 3px solid var(--ink); border-radius: 14px; padding: 16px;
       box-shadow: 0 4px 0 var(--ink); }
.title { font-weight: 700; font-size: 34px; line-height: 1; letter-spacing: .5px; }
.title span { -webkit-text-stroke: 1.5px var(--ink); }
.turn { display: flex; align-items: center; gap: 12px; }
.chip { width: 34px; height: 34px; border-radius: 50%; border: 3px solid var(--ink); flex: none;
        display: flex; align-items: center; justify-content: center; color: #fff; font-weight: 700; }
.turn .who { font-size: 22px; font-weight: 700; line-height: 1.1; }
.turn small { display: block; font-size: 13px; opacity: .7; font-weight: 500; }
.dicerow { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
.die { width: 84px; height: 84px; flex: none; background: #f6dc63; border: 3px solid var(--ink);
       border-radius: 16px; display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 12px;
       box-shadow: 0 5px 0 var(--ink); }
.die i { width: 13px; height: 13px; border-radius: 50%; background: var(--ink); place-self: center;
         visibility: hidden; }
.die.rolling { animation: shake .45s ease-in-out; }
@keyframes shake { 0%,100% { transform: rotate(0) } 25% { transform: rotate(-14deg) scale(1.05) }
                   50% { transform: rotate(10deg) } 75% { transform: rotate(-6deg) } }
.roll { flex: 1; background: #ea6a55; color: #fff; border: 3px solid var(--ink); border-radius: 14px;
        font-weight: 700; font-size: 22px; padding: 18px 10px; box-shadow: 0 5px 0 var(--ink);
        transition: transform .08s, box-shadow .08s; }
.roll:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
.roll:disabled { opacity: .55; cursor: default; }
.card { flex: 1 1 auto; min-height: 150px; display: flex; flex-direction: column; gap: 8px; overflow: auto; }
.card .tag { align-self: flex-start; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px;
             border: 2px solid var(--ink); background: #fff; }
.card h2 { font-size: 26px; line-height: 1.1; }
.card p { font-size: 18px; line-height: 1.35; }
.card .note { font-size: 14px; background: rgba(255,255,255,.55); border-radius: 10px; padding: 8px 10px;
              border: 2px dashed var(--ink); }
.players { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow: auto; }
.prow { display: flex; align-items: center; gap: 10px; font-size: 15px; }
.prow .chip { width: 24px; height: 24px; border-width: 2px; font-size: 11px; }
.prow .pos { margin-left: auto; font-size: 13px; opacity: .75; text-align: right; }
.prow.cur { font-weight: 700; }
.tools { display: flex; gap: 8px; }
.ghost { flex: 1; background: var(--card); border: 3px solid var(--ink); border-radius: 12px; padding: 9px;
         font-weight: 700; font-size: 14px; box-shadow: 0 3px 0 var(--ink); }

.overlay { position: fixed; inset: 0; background: rgba(38,35,58,.55); display: none; align-items: center;
           justify-content: center; z-index: 50; padding: 16px; }
.overlay.show { display: flex; }
.modal { background: var(--paper); border: 3px solid var(--ink); border-radius: 18px; padding: 22px;
         width: min(520px, 100%); max-height: 90vh; overflow: auto; box-shadow: 0 8px 0 var(--ink); }
.modal h2 { font-size: 26px; margin-bottom: 6px; }
.modal p.sub { font-size: 14px; opacity: .75; margin-bottom: 14px; }
.plist { display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; }
.pin { display: flex; gap: 8px; align-items: center; }
.pin input { flex: 1; font: inherit; font-size: 17px; padding: 10px 12px; border: 3px solid var(--ink);
             border-radius: 10px; background: #fff; min-width: 0; }
.pin .chip { cursor: pointer; }
.pin .x { background: none; border: none; font-size: 22px; width: 34px; }
.row { display: flex; gap: 10px; margin-top: 8px; }
.big { flex: 1; background: #8cc26f; border: 3px solid var(--ink); border-radius: 14px; padding: 14px;
       font-weight: 700; font-size: 19px; box-shadow: 0 4px 0 var(--ink); }
.big.alt { background: var(--card); }
.rules { display: flex; flex-direction: column; gap: 10px; }
.rule { display: grid; grid-template-columns: 34px 1fr; gap: 8px; align-items: start; }
.rule .n { width: 34px; height: 34px; border: 2px solid var(--ink); border-radius: 8px; display: flex;
           align-items: center; justify-content: center; font-weight: 700; font-size: 13px; }
.rule b { font-size: 14px; display: block; margin-bottom: 3px; }
.rule textarea { width: 100%; font: inherit; font-size: 14px; padding: 6px 8px; border: 2px solid var(--ink);
                 border-radius: 8px; resize: vertical; min-height: 44px; background: #fff; }
.win { text-align: center; }
.win .trophy { font-size: 64px; }
.fine { font-size: 12px; opacity: .65; margin-top: 12px; text-align: center; }

@media (max-width: 900px) {
  body { display: block; }
  .app { grid-template-columns: 1fr; height: auto; padding: 10px; gap: 10px; max-width: none; }
  .boardwrap { height: 62vh; }
  .title { font-size: 26px; }
  .card { min-height: 120px; }
  .players { max-height: none; }
}

.langs { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
.langs button { border: 3px solid var(--ink); border-radius: 99px; padding: 5px 14px; font-weight: 700; font-size: 14px;
  background: var(--card); box-shadow: 0 3px 0 var(--ink); }

const LAST = CELLS.length - 1;
const COLORS = ["#ea6a55", "#2f8f8f", "#7a5aa8", "#f5a05a", "#5fa0c6", "#f27fa0", "#8b4a30", "#26233a", "#4c9a3c", "#d4a017", "#1f4e8c", "#c2185b"];
const PIPS = {1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
let lang = store.get("start.lang", null) || "es";
const t = (k, v = {}) => UI[lang][k].replace(/\{(\w+)\}/g, (_, x) => v[x]);
const ordinal = n => n + ({1: "st", 2: "nd", 3: "rd"}[(n % 100 > 10 && n % 100 < 14) ? 0 : n % 10] || "th");
const nm = i => CELLS[i].name[lang];
const DEFAULT_RULES = { es: CELLS.map(c => c.rule.es), en: CELLS.map(c => c.rule.en) };
const rulesFor = l => { const r = store.get("start5.rules." + l, null); return r && r.length === CELLS.length ? r : DEFAULT_RULES[l].slice(); };
let rules = rulesFor(lang);

let G = store.get("start4.game", null);
let busy = false, lastCard = null;

/* ---------- idioma ---------- */
function applyLang() {
  document.documentElement.lang = lang;
  document.title = t("title");
  $("boardimg").src = BOARD[lang]; $("boardimg").alt = t("boardAlt");
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll(".cell").forEach(el => el.title = nm(+el.dataset.i));
  document.querySelectorAll(".langs button").forEach(b => b.classList.toggle("on", b.dataset.lang === lang));
  $("btnLang").textContent = lang === "es" ? "EN" : "ES";
  $("btnLang").title = lang === "es" ? "English" : "Español";
  rules = rulesFor(lang);
  if ($("setup").classList.contains("show")) drawDraft();
  renderPanel();
  if (lastCard) showCard(lastCard.idx);
}
function setLang(l) { lang = l; store.set("start.lang", l); applyLang(); }
document.querySelectorAll(".langs button").forEach(b => b.onclick = () => setLang(b.dataset.lang));
$("btnLang").onclick = () => setLang(lang === "es" ? "en" : "es");

/* ---------- escala del tablero ---------- */
function fit() {
  const wrap = $("wrap"), page = $("page");
  const pw = page.offsetWidth, ph = page.offsetHeight;
  const s = Math.min(wrap.clientWidth / pw, wrap.clientHeight / ph);
  $("scaler").style.transform = `scale(${s}) translate(-50%, -50%)`;
}
addEventListener("resize", fit);

/* ---------- fichas ---------- */
function tokenSpot(cellIdx, k, n) {
  const c = CELLS[cellIdx];
  const cols = Math.min(n, c.w > 110 ? 4 : c.w > 90 ? 3 : 2), rows = Math.ceil(n / cols);
  const sx = Math.min(32, (c.w - 28) / Math.max(cols - 1, 1)), sy = Math.min(32, (c.h - 28) / Math.max(rows - 1, 1));
  const col = k % cols, row = Math.floor(k / cols);
  return [c.x + c.w / 2 - 14 + (col - (cols - 1) / 2) * sx, c.y + c.h / 2 - 14 + (row - (rows - 1) / 2) * sy];
}
function markHere(pos) {
  document.querySelectorAll(".cell.here").forEach(el => el.classList.remove("here"));
  const el = document.querySelector(`.cell[data-i="${pos}"]`); if (el) el.classList.add("here");
}
function drawTokens() {
  document.querySelectorAll(".token").forEach(el => el.remove());
  document.querySelectorAll(".cell.here").forEach(el => el.classList.remove("here"));
  if (!G) return;
  const groups = {};
  G.players.forEach((p, i) => (groups[p.pos] = groups[p.pos] || []).push(i));
  G.players.forEach((p, i) => {
    const g = groups[p.pos], [x, y] = tokenSpot(p.pos, g.indexOf(i), g.length);
    const el = document.createElement("div");
    el.className = "token" + (i === G.cur && !G.over ? " active" : "");
    el.id = "tok" + i; el.style.background = p.color; el.textContent = tag(p);
    el.style.left = x + "px"; el.style.top = y + "px";
    $("page").appendChild(el);
  });
  if (G.players[G.cur] && !G.over) markHere(G.players[G.cur].pos);
}
function placeToken(i) {
  const p = G.players[i];
  if (i === G.cur) markHere(p.pos);
  const same = G.players.map((q, j) => q.pos === p.pos ? j : -1).filter(j => j >= 0);
  same.forEach(j => {
    const [x, y] = tokenSpot(p.pos, same.indexOf(j), same.length);
    const el = $("tok" + j); if (el) { el.style.left = x + "px"; el.style.top = y + "px"; }
  });
}
const initial = n => (n.trim()[0] || "?").toUpperCase();
const tag = p => p.tag || initial(p.name);
function setTags(list) {
  const used = new Set();
  list.forEach(p => {
    const s = p.name.trim().replace(/\s+/g, "") || "?";
    const multi = list.filter(q => initial(q.name) === initial(p.name)).length > 1;
    const cands = multi ? [...s.slice(1)].map(c => s[0].toUpperCase() + c.toLowerCase()) : [s[0].toUpperCase()];
    let tg = cands.find(c => !used.has(c));
    for (let n = 2; !tg; n++) if (!used.has(s[0].toUpperCase() + n)) tg = s[0].toUpperCase() + n;
    used.add(tg); p.tag = tg;
  });
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

async function walk(i, to) {
  const p = G.players[i], step = to > p.pos ? 1 : -1;
  const far = Math.abs(to - p.pos) > 8;
  while (p.pos !== to) {
    const from = p.pos;
    p.pos = far && step < 0 ? to : p.pos + step;
    placeToken(i);
    const left = G.players.map((q, j) => q.pos === from ? j : -1).filter(j => j >= 0);
    left.forEach(j => { const [x, y] = tokenSpot(from, left.indexOf(j), left.length);
                        const el = $("tok" + j); el.style.left = x + "px"; el.style.top = y + "px"; });
    await sleep(far && step < 0 ? 450 : 230);
  }
}

/* ---------- interfaz ---------- */
function setDie(n) {
  $("die").querySelectorAll("i").forEach((el, k) => el.style.visibility = PIPS[n].includes(k) ? "visible" : "hidden");
}
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
function showCard(idx, extra, label, who) {
  const c = CELLS[idx];
  lastCard = { idx, self: !label || who == null, who };
  $("card").style.background = c.bg;
  const dark = ["#2f8f8f", "#2a6b70", "#7a5aa8", "#3a8f8f"].includes(c.bg);
  $("card").style.color = dark ? "#fff" : "";
  $("card").innerHTML = `<span class="tag" style="color:var(--ink)">${label || t("square", {n: idx})}</span>
    <h2>${esc(nm(idx))}</h2><p>${esc(rules[idx])}</p>` +
    (extra ? `<div class="note" style="color:var(--ink)">${extra}</div>` : "");
}

function renderPanel() {
  if (!G) { $("roll").textContent = t("roll"); return; }
  const p = G.players[G.cur];
  $("turnChip").style.background = p.color; $("turnChip").textContent = tag(p);
  $("turnName").innerHTML = esc(p.name) + `<small>${p.skip ? t("inJail") : t("yourTurn")}</small>`;
  $("roll").textContent = p.skip ? t("pass") : t("roll");
  $("players").innerHTML = G.players.map((q, i) => `<div class="prow ${i === G.cur ? "cur" : ""}">
      <div class="chip" style="background:${q.color}">${esc(tag(q))}</div>${esc(q.name)}
      <span class="pos">${q.done ? t("finished") : q.pos === 0 ? t("start") : t("square", {n: q.pos}) + " · " + esc(nm(q.pos))}${q.skip ? " · 🔒" : ""}</span></div>`).join("");
  drawTokens();
  store.set("start4.game", G);
}

function nextPlayer() {
  if (!G.players.some(p => !p.done)) return;
  do { G.cur = (G.cur + 1) % G.players.length; } while (G.players[G.cur].done);
}

async function play() {
  if (busy || !G || G.over) return;
  const i = G.cur, p = G.players[i];
  if (p.skip) {
    p.skip = false;
    showCard(24, t("jailOut", {p: esc(p.name)}), t("jail"));
    nextPlayer(); renderPanel(); return;
  }
  busy = true; $("roll").disabled = true;
  const die = $("die"); die.classList.remove("rolling"); void die.offsetWidth; die.classList.add("rolling");
  for (let k = 0; k < 7; k++) { setDie(1 + Math.floor(Math.random() * 6)); await sleep(60); }
  const n = 1 + Math.floor(Math.random() * 6); setDie(n);
  await sleep(150);
  drawTokens();
  await walk(i, Math.min(p.pos + n, LAST));
  if (p.first == null) p.first = p.pos;

  let again = false, notes = [t("rolled", {n})];
  for (let hop = 0; hop < 4; hop++) {
    const c = CELLS[p.pos], mv = c.move;
    if (typeof mv === "number") {
      showCard(p.pos, notes.join(" "));
      await sleep(900);
      notes.push(t(mv > 0 ? "ahead" : "back", {n: Math.abs(mv), c: esc(nm(p.pos))}));
      await walk(i, Math.max(0, Math.min(p.pos + mv, LAST)));
      continue;
    }
    if (mv === "start") {
      showCard(p.pos, notes.join(" ")); await sleep(1100);
      notes.push(t("toStart")); await walk(i, 0); break;
    }
    if (mv === "jail") { p.skip = true; notes.push(t("missTurn")); }
    if (mv === "pct") { const d = 1 + Math.floor(Math.random() * 6); setDie(d); notes.push(t("pct", {d, p: d * 10})); }
    if (mv === "again") { again = true; notes.push(t("again")); }
    if (mv === "copy") {
      notes.push(p.first && p.first !== p.pos
        ? t("copy", {c: esc(nm(p.first)), r: esc(rules[p.first])})
        : t("noCopy"));
    }
    if (mv === "end") { p.done = true; }
    break;
  }
  showCard(p.pos, notes.join(" "), t("cardTag", {p: esc(p.name), n: p.pos}), i);

  if (p.done) {
    G.finish = (G.finish || 0) + 1;
    p.place = G.finish;
    const left = G.players.filter(q => !q.done).length;
    $("winTitle").textContent = p.place === 1 ? t("wins", {p: p.name}) : t("place", {p: p.name, n: p.place, nth: ordinal(p.place)});
    $("winSub").textContent = left ? t("othersGo") : t("allDone");
    $("keepGoing").style.display = left ? "" : "none";
    $("winDlg").classList.add("show");
    if (!left) G.over = true;
  }
  if (!again || p.done) nextPlayer();
  busy = false; $("roll").disabled = !!G.over;
  renderPanel();
}

/* ---------- setup ---------- */
let draft = [];
function openSetup() {
  draft = G ? G.players.map(p => ({ name: p.name, color: p.color }))
            : [{ name: "", color: COLORS[0] }, { name: "", color: COLORS[1] }];
  drawDraft(); $("setup").classList.add("show");
}
function drawDraft() {
  $("plist").innerHTML = draft.map((p, i) => `<div class="pin">
      <div class="chip" data-c="${i}" style="background:${p.color}"></div>
      <input data-n="${i}" placeholder="${t("player", {n: i + 1})}" value="${esc(p.name)}" maxlength="18">
      ${draft.length > 2 ? `<button class="x" data-x="${i}" aria-label="${t("remove")}">×</button>` : ""}</div>`).join("");
  $("addP").style.display = draft.length >= 12 ? "none" : "";
}
$("plist").addEventListener("input", e => { if (e.target.dataset.n) draft[e.target.dataset.n].name = e.target.value; });
$("plist").addEventListener("click", e => {
  const d = e.target.dataset;
  if (d.x) { draft.splice(+d.x, 1); drawDraft(); }
  if (d.c) { const p = draft[d.c]; p.color = COLORS[(COLORS.indexOf(p.color) + 1) % COLORS.length]; drawDraft(); }
});
$("addP").onclick = () => {
  const used = draft.map(p => p.color);
  draft.push({ name: "", color: COLORS.find(c => !used.includes(c)) || COLORS[0] }); drawDraft();
  $("plist").querySelector(`input[data-n="${draft.length - 1}"]`).focus();
};
$("go").onclick = () => {
  G = { cur: 0, players: draft.map((p, i) => ({ name: p.name.trim() || t("player", {n: i + 1}), color: p.color,
        pos: 0, first: null, skip: false, done: false })) };
  setTags(G.players);
  $("setup").classList.remove("show"); $("roll").disabled = false;
  showCard(0, t("beginNote"), t("begin"));
  setDie(1); renderPanel();
};
$("btnNew").onclick = openSetup;
$("winNew").onclick = () => { $("winDlg").classList.remove("show"); openSetup(); };
$("keepGoing").onclick = () => $("winDlg").classList.remove("show");

/* ---------- reglas ---------- */
$("btnRules").onclick = () => {
  $("rulesList").innerHTML = CELLS.map((c, i) => `<div class="rule"><div class="n" style="background:${c.bg}">${i}</div>
    <div><b>${esc(nm(i))}</b><textarea data-r="${i}">${esc(rules[i])}</textarea></div></div>`).join("");
  $("rulesDlg").classList.add("show");
};
$("rulesSave").onclick = () => {
  $("rulesList").querySelectorAll("textarea").forEach(el => rules[el.dataset.r] = el.value.trim() || DEFAULT_RULES[lang][el.dataset.r]);
  store.set("start5.rules." + lang, rules); $("rulesDlg").classList.remove("show");
  if (lastCard) showCard(lastCard.idx);
};
$("rulesReset").onclick = () => {
  rules = DEFAULT_RULES[lang].slice(); store.set("start5.rules." + lang, rules);
  $("rulesList").querySelectorAll("textarea").forEach(el => el.value = rules[el.dataset.r]);
};
$("rulesDlg").addEventListener("click", e => { if (e.target.id === "rulesDlg") $("rulesDlg").classList.remove("show"); });

/* ---------- eventos ---------- */
$("roll").onclick = play;
addEventListener("keydown", e => {
  if (e.code === "Space" && !document.querySelector(".overlay.show") && !/INPUT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); play(); }
});
$("page").addEventListener("click", e => {
  const c = e.target.closest(".cell"); if (c && !busy) showCard(+c.dataset.i);
});

applyLang(); setDie(1);
$("boardimg").addEventListener("load", fit); fit();
if (G && G.players && G.players.length) {
  showCard(G.players[G.cur].pos, t("resumedNote"), t("resumed"));
  $("roll").disabled = !!G.over; renderPanel();
} else openSetup();
document.fonts && document.fonts.ready.then(fit);
</script>
</body></html>
